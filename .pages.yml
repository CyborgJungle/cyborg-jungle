# Pages CMS configuration — https://app.pagescms.org
# Every save commits to GitHub, and Vercel redeploys the site automatically.

media:
  # Uploads land in src/assets/media; the site resizes them at build time.
  input: src/assets/media
  output: /media
  categories: [image]

content:
  - name: home
    label: Home page
    type: file
    path: src/content/home.json
    format: json
    fields:
      - name: heroImage
        label: Hero image
        type: image
        description: "The one big image at the top of the home page. Pick any frame from Final art (it links to its project) or upload a new image."
        options:
          path: src/assets/media/Final art
          extensions: [jpg, jpeg, png, webp]
          rename: safe

  - name: works
    label: Works
    type: collection
    path: src/content/works
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, kind, year]
      primary: title
      sort: [year, title]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: kana
        label: Title in katakana
        type: string
        description: "Shown vertically on the project's poster card, e.g. スワンシグナル."
      - name: kind
        label: Channel
        type: select
        required: true
        options:
          values:
            - name: image
              label: "CH.01 Image"
            - name: video
              label: "CH.02 Video"
            - name: installation
              label: "CH.03 Interactive installation"
      - name: year
        label: Year
        type: number
        required: true
      - name: order
        label: Order
        type: number
        description: "Position on the site: 1 comes first. Leave empty to sort by date."
      - name: date
        label: Date (optional)
        type: date
        description: "Orders works within the same year, newest first."
      - name: tags
        label: Tags
        type: select
        description: "What the work shows and what the signal does to it. Visitors can filter a channel by tag."
        options:
          multiple: true
          values: ["portrait", "figure", "dance", "eye band", "window", "diamond", "mosaic", "checkerboard", "colour key", "colour bleed", "tear", "melt", "interference", "noise", "monochrome", "silhouette", "op-art"]

      - name: video
        label: Video link
        type: string
        description: "Vimeo or YouTube link, as copied from the browser (e.g. https://vimeo.com/123456789). The video must allow embedding."
      - name: image
        label: Main image
        type: image
        description: "Shown large on the work's page and as its tile. For videos it replaces the Vimeo/YouTube thumbnail. JPEG, PNG or WebP; under 10 MB please, the site resizes it."
        options:
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: gallery
        label: Extra images
        type: image
        description: "More views, e.g. installation shots. Shown under the main image."
        options:
          multiple:
            max: 40
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: cover
        label: Preview frame
        type: number
        description: "The frame shown on this series' card. Use the number from the counter on the project page (e.g. 06 / 22 → 6). Leave empty for the main image."
      - name: slideshow
        label: Play as slideshow
        type: boolean
        description: "Cycle the main image and extra images on a timer, on the home wall and the work's page. Use for variations of one image."
      - name: interval
        label: Seconds per image
        type: number
        description: "Slideshow speed. Leave empty for 1 second."
      - name: alt
        label: Image description (alt text)
        type: string
        description: "One sentence describing what the image shows, read out by screen readers and used by search engines."
      - name: description
        label: Description
        type: text
        description: "Plain text. Leave an empty line between paragraphs."
      - name: medium
        label: Medium
        type: string
        description: "Equipment / process, e.g. Video synthesizer, CRT rescan"
      - name: format
        label: Format
        type: string
        description: "e.g. PAL 4:3 · Hi8, or Archival pigment print · 60 × 80 cm"
      - name: duration
        label: Duration
        type: string
        description: "Videos, e.g. 06:12"
      - name: location
        label: Location
        type: string
        description: "Installations: where it was shown"
      - name: aspect
        label: Frame shape (optional)
        type: string
        description: "Override the screen shape, e.g. 4 / 3 or 16 / 9. Usually leave empty."
      - name: pattern
        label: Placeholder pattern
        type: select
        description: "Test pattern shown when there is no image or video yet."
        options:
          values: [stripes, rings, grid, tunnel, scan, bars]

  - name: about
    label: About page
    type: file
    path: src/content/about.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: practice
        label: Practice
        type: string
      - name: based
        label: Based in
        type: string
      - name: active
        label: Active since
        type: string
      - name: instagram
        label: Instagram
        type: string
        description: "Handle without @, e.g. cyborgjungle. Shown in the footer and on About."
      - name: contact
        label: Contact (extra line)
        type: string
        description: "Optional extra contact line on About. Messages from the contact form go to cyborgjungle@gmail.com."
      - name: portrait
        label: Portrait
        type: image
        options:
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: portraitCredit
        label: Portrait credit
        type: string
        description: "Shown under the portrait, e.g. Photo: RayRay"
      - name: bio
        label: Bio
        type: text
        description: "Plain text. Leave an empty line between paragraphs."
      - name: photos
        label: Live photos
        description: "Photos of you at work, shown under your profile."
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index}. {caption}"
        fields:
          - name: image
            label: Photo
            type: image
            options:
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: caption
            label: Caption
            type: string
            description: "e.g. Live set · 10.12.2022 · Photo: RayRay"
